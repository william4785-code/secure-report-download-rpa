name: Synthetic Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-demo:
    name: Run offline synthetic workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run synthetic demo
        run: >-
          python -m secure_report_download_rpa
          --demo
          --include-experimental
          --demo-output-dir demo_output/github-actions

      - name: Upload synthetic outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-rpa-demo-${{ github.run_number }}
          path: demo_output/github-actions/routed/
          if-no-files-found: error
          retention-days: 7

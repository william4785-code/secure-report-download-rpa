name: Synthetic Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-demo:
    name: Run offline synthetic workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run synthetic demo
        run: >-
          python -m secure_report_download_rpa
          --demo
          --include-experimental
          --demo-output-dir demo_output/github-actions

      - name: Upload synthetic outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-rpa-demo-${{ github.run_number }}
          path: demo_output/github-actions/routed/
          if-no-files-found: error
          retention-days: 7

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=scripts --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/check_public_safety.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
]
